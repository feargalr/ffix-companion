<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b56a8"/>
      <stop offset="0.45" stop-color="#1d3c80"/>
      <stop offset="1" stop-color="#0b1534"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.45" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#a87a22"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6dc9b"/>
      <stop offset="1" stop-color="#d4a443"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#aabbd1" stroke-width="10"/>
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="#080f28" stroke-opacity="0.55" stroke-width="4"/>
  <!-- crystal -->
  <g transform="translate(256 252)">
    <polygon points="0,-170 92,-40 0,170 -92,-40" fill="url(#gem)"/>
    <polygon points="0,-170 0,170 -92,-40" fill="url(#gemL)" opacity="0.85"/>
    <polygon points="-92,-40 92,-40 0,-170" fill="#fff8e0" opacity="0.35"/>
    <polyline points="-92,-40 0,-10 92,-40" fill="none" stroke="#fff4cf" stroke-width="5" opacity="0.8"/>
    <line x1="0" y1="-10" x2="0" y2="170" stroke="#8a5f14" stroke-width="4" opacity="0.5"/>
    <polygon points="0,-170 92,-40 0,170 -92,-40" fill="none" stroke="#fff1c8" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- check -->
  <path d="M190 268 l46 46 l92 -104" fill="none" stroke="#0b1534" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 268 l46 46 l92 -104" fill="none" stroke="#f5f7ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
